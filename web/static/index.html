<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>논문 글쓰기 진단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 2026-11-09 디자인 시안(포털과 같은 청록·남색·황토, 원소 칸 모티프) 적용. 빨강은 쓰지 않는다. */
:root{--bg:#FAFCFC;--card:#FFFFFF;--sunk:#F3F7F8;--band:#EFF6F5;--ink:#13233A;--navy:#13233A;--muted:#4E5E6B;--faint:#7C8A94;--line:#DCE5E7;--line2:#C8D4D7;
--accent:#0E6F68;--accent-hover:#0A5A54;--accent-soft:#E2F2EF;--on-accent:#FFFFFF;--mark:#D7F5E9;
--out:#9A6312;--out-soft:#FBF1E1;--c1:#0E6F68;--c2:#2F4B8C;--c3:#9A6312;--c4:#6B7780;
--sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--serif:"Source Serif 4",Georgia,"Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A22;--card:#15232D;--sunk:#12202A;--band:#132A2C;--ink:#E7EEF2;--navy:#E7EEF2;--muted:#A9B8C2;--faint:#7D8D98;--line:#263843;--line2:#33495566;
--accent:#4FC2B4;--accent-hover:#74D3C7;--accent-soft:#173A38;--on-accent:#0F1A22;--mark:#1D4A44;--out:#E0A956;--out-soft:#3A2E1A;--c1:#4FC2B4;--c2:#8FA9EC;--c3:#E0A956;--c4:#93A1AB}}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 32px;min-height:64px}
header .brand span,.seg button{white-space:nowrap}
header .brand{flex:1;display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
header .brand span{font-weight:700;font-size:18px;letter-spacing:-.01em}
header .brand small{font-size:13px;color:var(--faint)}
header .brand .abbr{display:inline-block;align-self:center;padding:1px 7px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:500;letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--card)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:6px;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:0 32px 40px}
.hero{padding:56px 0 36px}
.hero h2{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.025em;line-height:1.3;font-weight:700;margin:0 0 12px;color:var(--ink)}
.hero .sub,.hero .desc{margin:0;color:var(--muted);font-size:17px;max-width:46em}
/* 01~03 세로선 단계 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.card.step{position:relative;background:transparent;border:0;border-radius:0;padding:4px 0 48px 76px;margin:0}
.card.step::before{content:"";position:absolute;left:23px;top:48px;bottom:0;width:1.5px;background:var(--line)}
.card.step h2,h2.step{font-size:24px;letter-spacing:-.02em;line-height:1.35;font-weight:700;margin:0 0 6px;color:var(--ink);display:flex;align-items:center;gap:12px}
.card.step h2 .stepno{position:absolute;left:4px;top:0}
h2.step{position:relative;padding-left:76px;margin:0 0 16px!important}
h2.step .stepno{position:absolute;left:4px;top:-4px}
.stepno{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--accent);color:var(--on-accent);background:var(--accent);display:inline-grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.step select{width:100%;max-width:680px;height:52px;padding:0 16px;background:var(--card);border:1.5px solid var(--line2);border-radius:10px;font-size:16.5px;cursor:pointer}
.step select:hover{border-color:var(--accent)}
.step .note{max-width:680px}
/* 2×2 원고 입력 */
#inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.box:focus-within{border-color:var(--accent)}
.box-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunk)}
.box-head label{font-weight:600;font-size:15px}
.box-head span{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.box textarea{border:0;resize:vertical;min-height:180px;padding:14px 16px;background:transparent;font:15.5px/1.65 var(--serif);outline:none;color:var(--ink);width:100%}
.box textarea::placeholder{font-family:var(--sans);color:var(--faint)}
.go-row{margin-top:24px}
.row{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;height:50px;padding:0 26px;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;font-size:16.5px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line2);font-weight:500;font-size:15.5px;padding:0 20px}
.btn.ghost:hover{border-color:var(--faint);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
.note{font-size:14px;color:var(--muted)}
.muted{color:var(--faint)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--out-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:14.5px;margin:12px 0;max-width:820px}
.warn::before{content:"";flex:0 0 6px;height:6px;margin-top:9px;border-radius:50%;background:var(--out)}
.linkish{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}
/* ▸ 설명 단추 */
.i,.ibtn{display:inline-flex;align-items:center;gap:2px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);border-radius:6px;padding:0 7px;height:21px;
font:600 11.5px/1 var(--sans);cursor:pointer;background:transparent;margin-left:6px;vertical-align:1px;white-space:nowrap}
.i:hover,.ibtn:hover,.i[aria-expanded=true]{background:var(--accent-soft)}
.ex{border-left:3px solid var(--accent);background:var(--band);border-radius:0 8px 8px 0;padding:8px 12px;margin:6px 0;font-size:14px}
.ex b{display:block;margin-bottom:2px}
.ex .en{font-family:var(--serif)}
.ex .en+.ko{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.ko2{display:block;font-size:11.5px;font-weight:400;color:var(--faint)}
.guide,.hint{font-size:13.5px;color:var(--faint);margin:8px 0 12px}
/* 결과: 절별 개요 탭 */
#overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;margin:0 0 24px}
.ov{text-align:left;background:transparent;border:0;border-right:1px solid var(--line);padding:16px 18px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.ov:last-child{border-right:0}
.ov:hover{background:var(--sunk)}
.ov[aria-selected=true]{background:var(--band);box-shadow:inset 0 -3px 0 var(--accent)}
.ov .t{font-weight:700;font-size:16px}
.ov .w,.ov .o{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ov .w b{color:var(--ink);font-weight:600}
.ov .o b{color:var(--out);font-weight:600}
.ov[disabled]{cursor:default;opacity:.5}
.secttl{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 16px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:8px}
.secttl h2{margin:0;font-size:20px;letter-spacing:-.015em}
.secttl .muted{font-size:14px;color:var(--muted)}
#results>section.card{background:transparent;border:0;padding:0;margin:0 0 32px}
h3{font-size:16.5px;font-weight:700;margin:36px 0 10px}
/* 표 */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tablewrap table{min-width:860px}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.5}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;font-weight:600;color:var(--faint);background:var(--sunk);white-space:nowrap}
tbody tr:last-child>td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.exrow td{border-bottom:0;padding-top:0;padding-bottom:0}
tr.exrow td>div{position:sticky;left:0;max-width:min(1100px,calc(100vw - 72px));white-space:normal}
tr.exrow td>div:not(:empty){padding:4px 0 10px}
/* 판정: 빨강 없이 글자 색으로 */
.tag{display:inline-block;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.typical{color:var(--muted)}
.higher,.lower{color:var(--out);font-weight:600}
.beyond_high,.beyond_low{color:var(--out);font-weight:700}
.na{color:var(--faint)}
/* ①~④ 분류 배지(원소 칸) */
.cat{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:13.5px}
.cat .el{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);display:grid;place-items:center;font:700 12px/1 var(--mono)}
.cat .lb{color:var(--c);font-weight:600}
.L-genre{--c:var(--c1)}.L-field{--c:var(--c2)}.L-rare{--c:var(--c3)}.L-none{--c:var(--c4)}
.cats{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 12px}
/* 위치 눈금: 전체 범위(회색 선)·참조 범위(청록 띠)·중앙값(눈금)·원고(점) */
.bar{position:relative;width:220px;height:22px}
.bar .track{position:absolute;top:10px;height:2px;background:var(--line2);border-radius:1px}
.bar .iqr{position:absolute;top:5px;height:12px;background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:3px}
.bar .med{position:absolute;top:2px;width:2px;height:18px;background:var(--accent)}
.bar .you{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ink);border:2px solid var(--card);z-index:2}
.bar .you.out{background:var(--out)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--muted);margin:10px 0 0;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block}
.sw.trk{width:22px;height:2px;background:var(--line2)}
.sw.iqr{width:22px;height:12px;background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:3px}
.sw.med{width:2px;height:14px;background:var(--accent)}
.sw.you{width:12px;height:12px;border-radius:50%;background:var(--ink)}
/* 쓰임 알약 */
.chip{display:inline-block;font-size:12.5px;border:1px solid var(--line2);border-radius:999px;padding:0 8px;margin:1px 3px 1px 0;white-space:nowrap;color:var(--muted);background:var(--card)}
/* 동사 이름: 펼침 꺾쇠 */
button.vbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;font:600 16.5px/1.4 var(--serif);color:var(--ink);text-decoration:none}
button.vbtn::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
button.vbtn[aria-expanded=true]::before{transform:rotate(45deg)}
button.vbtn:hover{color:var(--accent)}
tbody td:first-child:has(.vbtn){white-space:nowrap}
.ext{font-size:12px;color:var(--faint);margin-left:4px;text-decoration:none}
.nl{font-size:12px;color:var(--out);font-weight:600;margin-top:4px;white-space:nowrap}
.nlt{color:var(--out);font-weight:600}
/* KWIC 줄 */
.kwic{background:var(--sunk);border-radius:8px;padding:6px 14px 8px;margin:4px 0;overflow-x:auto}
.kwic .kl{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;column-gap:8px;align-items:baseline;font:13.5px/1.9 var(--mono);color:var(--muted);cursor:pointer;border-bottom:1px dashed var(--line);min-width:640px}
.kwic .kl:has(.s){grid-template-columns:4ch minmax(0,1fr) auto minmax(0,1fr) auto}
.kwic .kl:last-child{border-bottom:0}
.kwic .kl:hover{background:var(--accent-soft)}
.kwic .l{white-space:nowrap;overflow:hidden;display:flex;justify-content:flex-end}
.kwic .r{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kwic .k{color:var(--ink);font-weight:500;background:var(--mark);padding:0 5px;border-radius:3px;cursor:pointer}
.kwic .k:hover{text-decoration:underline dotted;text-underline-offset:3px}
.vguide{font-size:13px;color:var(--faint);margin:0 0 10px}
#wordlist .wlinfo{flex-basis:100%;margin:0 0 6px;font-size:13px}
#wordlist .wlinfo button{font:inherit;border:0;border-radius:0;padding:0;background:none;color:var(--accent)}
.kwic .s{color:var(--accent);font-weight:600;font-family:var(--sans);font-size:12px}
.kwic .kl .muted{font:12px var(--sans)}
.kwic .full{font:15px/1.65 var(--serif);color:var(--ink);margin:2px 0 8px;padding:8px 0 8px 14px;border-left:2px solid var(--accent);white-space:normal}
.kwic .full mark{background:var(--mark);color:var(--ink);font-weight:700;border-radius:3px;padding:0 3px;box-shadow:inset 0 -2px 0 var(--accent)}
.ev{font-size:14px;margin:4px 0;font-family:var(--serif)}
.selfnote{margin:6px 0 2px;font-size:13px;color:var(--muted)}
.selfnote .linkish{font-size:13px;text-align:left}
#openfold{white-space:normal;text-align:left;max-width:100%}
h2.step{flex-wrap:wrap}
.selfnote .en{display:block;font-size:12px;color:var(--faint);font-family:var(--serif)}
.ev mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
/* 분석 결과 풀이 */
.ctitle{margin:18px 0 0;font-size:15px;color:var(--ink)}
.comm{border-left:3px solid var(--accent);padding:2px 0 2px 18px;margin:10px 0}
.comm>b{display:none}
.comm p{margin:0 0 10px;font-size:15px;line-height:1.7}
.comm b.sub{display:block;font-weight:600;font-size:14px;margin:16px 0 6px;color:var(--ink)}
.comm p.cnote{font-size:13px;color:var(--faint);margin:6px 0 12px}
.comm p.en{font-family:var(--serif)}
.comm p.en+p.ko{margin-top:-6px;color:var(--muted)}
/* 기준 자료(네 저널 공통) — 접어 둠 */
details#commonfold{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 28px}
details#commonfold>summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details#commonfold>summary::-webkit-details-marker{display:none}
details#commonfold>summary span{font-weight:400;font-size:13.5px;color:var(--faint)}
details#commonfold[open]>summary{border-bottom:1px solid var(--line)}
#commonbox{border:0;background:transparent;padding:14px 18px 18px;margin:0}
#commonbox>h2{display:none}
#commonbox table{min-width:0}
#commonbox .tablewrap{margin:0 0 12px}
#commonbox td.vs{font-family:var(--serif);font-size:15.5px}
#commonbox details{margin-top:10px}
#commonbox summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14.5px}
/* 내 글 살펴보기 */
#explore{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:40px 0 0;margin-top:24px}
#explore h2{font-size:22px;letter-spacing:-.015em}
.wl{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.wl button{font:13px var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 9px;background:var(--card);cursor:pointer;color:var(--muted)}
.wl button b{font-weight:400;color:var(--faint);margin-left:4px}
.wl button:hover{border-color:var(--accent);color:var(--ink)}
.wl button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#explore select,#xq{height:40px;border:1px solid var(--line2);border-radius:8px;background:var(--card);padding:0 12px;font-size:14.5px}
#xq{width:220px;font-family:var(--mono)}
#savebox{background:var(--band);border:0}
#savebox h2{font-size:20px}
details.fold{padding:0}
details.fold summary{cursor:pointer;padding:14px 18px;font-weight:600;color:var(--ink)}
details.fold>div{padding:0 18px 14px}
#version{font:12px var(--mono);color:var(--faint)}
/* 결과 저장 영역 */
#savebox{padding:24px}
#savebox .save-g{max-width:860px;font-size:14.5px}
#savebox .save-row{margin:12px 0}
#savebox select{height:40px;border:1px solid var(--line2);border-radius:8px;background:var(--card);padding:0 12px;font-size:14.5px}
#savebox details.save-p summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14.5px;margin-top:8px}
#savebox pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:13.5px/1.65 var(--sans);max-width:860px}
/* 원고 정보(선택) */
details.mi{margin:14px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--card)}
details.mi summary{cursor:pointer;padding:10px 16px;font-weight:600;font-size:15px}
details.mi .mi-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;padding:0 16px 14px}
details.mi .mi-body .note,details.mi .mi-body .wide{grid-column:1/-1}
.ovnote{margin:12px 0 18px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14px;line-height:1.65}
.ovnote p{margin:0 0 6px}
.ovnote h4{margin:10px 0 4px;font-size:14.5px}.ovnote ul{list-style:none;padding-left:0}.ovnote .ovacts{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin-top:2px}
.ovnote .ovacts details{flex-basis:100%}.ovnote .ovacts details[open]{margin-top:2px}.ovnote .ovacts summary{display:inline}
.ovnote .gen{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;color:var(--muted);font-size:13.5px}
details.utab{margin:4px 0 14px;font-size:13.5px}details.utab>summary{cursor:pointer;color:var(--accent);font-weight:600}
details.utab h4{margin:12px 0 4px;font-size:14px}details.utab td.ex{font-family:var(--serif);white-space:normal;min-width:180px}
details.utab tr.sub td:first-child{padding-left:22px;font-weight:400}details.utab .en{display:block;font-size:12.5px;color:var(--faint)}
details.foldlong{margin-top:10px}details.foldlong>summary{cursor:pointer;color:var(--accent);font-weight:600}#foldbody .ex .en{display:block;font-size:12.5px;color:var(--faint)}
.ovnote details.ovwhy{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.ovnote details.ovwhy>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}.ovnote .ovwhy h4{margin:12px 0 4px;font-size:14px}.ovnote .ovwhy table{font-size:13.5px}.ovnote .ovwhy blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--line2);background:var(--bg)}.ovnote .en{display:block;font-size:12.5px;color:var(--faint)}

// ⓘ 단추: 바로 다음 설명 칸(같은 줄의 .slot 또는 표의 설명 줄)을 열고 닫는다
document.addEventListener("click", e => {
  const b = e.target.closest(".i"); if(!b) return;
  b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") !== "true");
  fillSlot(b); relabel(document);
});
// 단추 글자: 접힘 '▸ 설명', 펼침 '▾ 설명 접기'
function relabel(root){
  root.querySelectorAll(".i").forEach(b => { b.textContent = b.getAttribute("aria-expanded") === "true" ? "▾ " + t("ex_close") : "▸ " + t("ex_open"); b.title = exTitle(b.dataset.ex); });
  root.querySelectorAll(".ctog").forEach(b => { const el = document.getElementById(b.dataset.toggle); b.textContent = el && !el.hidden ? "▾ " + t("ex_close") : "▸ " + t("ex_open"); });
}
function slotOf(b){
  if(b.dataset.slot) return document.getElementById(b.dataset.slot);
  const host = b.closest(".card") || document; return host.querySelector(`.slot[data-for="${b.dataset.ex}"]`);
}
function fillSlot(b){
  const slot = slotOf(b); if(!slot) return;
  const keys = [...document.querySelectorAll(".i")].filter(x => slotOf(x) === slot && x.getAttribute("aria-expanded") === "true").map(x => x.dataset.ex);
  slot.innerHTML = [...new Set(keys)].map(exHtml).join("");
}
// 처음 서비스할 때는 설명을 모두 열어 둔다. 같은 설명이 표의 여러 줄에 되풀이되는 것(동사 층)은 표마다 한 번만 연다.
const OPEN_ALL = false;   // 2026-11-09: 처음에는 표만 간결하게, 설명은 단추로 펼친다
function openAll(root){
  if(!OPEN_ALL) return;
  const seen = new Set();
  root.querySelectorAll(".i").forEach(b => {
    if(b.hidden || b.closest("[hidden]")) return;
    const table = b.closest("table"), key = (table ? table.dataset.tid || "" : "") + "|" + b.dataset.ex;
    if(table && seen.has(key)) return;
    seen.add(key); b.setAttribute("aria-expanded", "true");
  });
  const slots = new Set([...root.querySelectorAll(".i[aria-expanded=true]")].map(slotOf).filter(Boolean));
  slots.forEach(sl => { const k = [...root.querySelectorAll(".i[aria-expanded=true]")].find(x => slotOf(x) === sl); if(k) fillSlot(k); });
}
function setAll(open){
  document.querySelectorAll("#results .i, #explore .i").forEach(b => b.setAttribute("aria-expanded", "false"));
  document.querySelectorAll("#results [id^=x], #explore .slot").forEach(el => { if(el.querySelector && el.querySelector(".ex")) el.innerHTML = ""; });
  if(open){ const keep = OPEN_ALL; forceOpen(document.getElementById("results")); forceOpen(document.getElementById("explore")); }
  relabel(document);
}
function forceOpen(root){
  const seen = new Set();
  root.querySelectorAll(".i").forEach(b => { if(b.closest("[hidden]")) return; const table = b.closest("table"), key = (table ? table.dataset.tid || "" : "") + "|" + b.dataset.ex;
    if(table && seen.has(key)) return; seen.add(key); b.setAttribute("aria-expanded", "true"); });
  new Set([...root.querySelectorAll(".i[aria-expanded=true]")].map(slotOf).filter(Boolean)).forEach(sl => { const k = [...root.querySelectorAll(".i[aria-expanded=true]")].find(x => slotOf(x) === sl); if(k) fillSlot(k); });
}

function bar(v, s, band){
  if(!s || v==null) return "";
  const lo = Math.min(s.min, v), hi = Math.max(s.max, v), span = (hi-lo)||1, p = x => ((x-lo)/span*100).toFixed(1);
  const out = band ? band !== "typical" : (v < s.q1 || v > s.q3);
  return `<div class="bar" aria-hidden="true"><div class="track" style="left:${p(s.min)}%;right:${(100-p(s.max)).toFixed(1)}%"></div>
    <div class="iqr" style="left:${p(s.q1)}%;width:${Math.max(p(s.q3)-p(s.q1),0.8)}%"></div><div class="med" style="left:${p(s.median)}%"></div>
    <div class="you${out?" out":""}" style="left:${p(v)}%"></div></div>`;
}
function bandTag(b){ return b ? `<span class="tag ${b}">${esc(LANG==="both"?BAND[b][0]+" / "+BAND[b][1]:tt(BAND[b]))}</span>` : `<span class="tag na">–</span>`; }

function highlight(sent, spans){
  let out = "", pos = 0;
  [...spans].sort((a,b)=>a.start-b.start).forEach(h => { if(h.start<pos) return; out += esc(sent.slice(pos,h.start)) + `<mark>${esc(sent.slice(h.start,h.end))}</mark>`; pos = h.end; });
  return out + esc(sent.slice(pos));
}

function xtokens(){
  const sv = document.getElementById("xsec").value || "ALL";
  const out = [];
  SECS.forEach(([c]) => { const S = LAST && LAST.sections[c]; if(!S || (sv!=="ALL" && sv!==c)) return;
    S.tokens.forEach(k => out.push({sec:c, sent:k[0], start:k[1], end:k[2], lemma:k[3], pos:k[4], usage:k[5], nl:k[6], S})); });
  return out;
}
let WL_MORE = false;
function wordlist(){
  const pv = document.getElementById("xpos").value, cnt = {};
  xtokens().forEach(k => { const p = k.pos==="PROPN" ? "NOUN" : k.pos; if(pv!=="ALL" && p!==pv) return; cnt[k.lemma] = (cnt[k.lemma]||0) + 1; });
  const q = document.getElementById("xq").value.trim().toLowerCase();
  // 2026-11-12: 처음엔 60개만 보이되 '전체 N개 중 60개 표시'와 '모두 보기'를 둔다(예전엔 60개에서 말없이 잘랐음)
  const all = Object.entries(cnt).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])), cut = WL_MORE ? all.length : Math.min(60, all.length);
  const info = all.length > 60 ? `<p class="note wlinfo">${esc(t("wl_shown").replace("{n}", all.length.toLocaleString()).replace("{m}", cut.toLocaleString()))} <button class="linkish" id="wlmore">${esc(t(WL_MORE ? "wl_less" : "wl_more"))}</button></p>` : "";
  const merge = pv === "ALL" ? `<p class="note wlinfo">${esc(t("wl_merge"))}</p>` : "";
  document.getElementById("wordlist").innerHTML = (info + merge + all.slice(0, cut)
    .map(([w,n]) => `<button data-word="${esc(w)}" class="${w===q?"on":""}">${esc(w)}<b>${n}</b></button>`).join("")) || esc(t("none"));
  const mb = document.getElementById("wlmore"); if(mb) mb.onclick = e => { e.stopPropagation(); WL_MORE = !WL_MORE; wordlist(); };
}

  if(!q){ box.hidden = true; cntEl.textContent = ""; wordlist(); return; }
  const useLemma = document.getElementById("xlemma").checked;
  let hits = xtokens().filter(k => useLemma ? k.lemma === q : k.S.sentences[k.sent-1].slice(k.start,k.end).toLowerCase() === q);
  const word = (k, dir) => { const s = k.S.sentences[k.sent-1]; const m = dir>0 ? s.slice(k.end).match(/[A-Za-z]+/) : s.slice(0,k.start).match(/([A-Za-z]+)[^A-Za-z]*$/); return m ? (dir>0?m[0]:m[1]).toLowerCase() : ""; };
  const so = document.getElementById("xsort").value;
  if(so==="right") hits.sort((a,b)=>word(a,1).localeCompare(word(b,1)));
  if(so==="left") hits.sort((a,b)=>word(a,-1).localeCompare(word(b,-1)));
  cntEl.textContent = `“${q}” ${hits.length} ${t("x_hits")}`;
  box.hidden = !hits.length;
  box.innerHTML = hits.map(k => { const s = k.S.sentences[k.sent-1];
    return `<div class="kl" data-full="${esc(s)}" data-s="${k.start}" data-e="${k.end}"><span class="s">${k.sec}</span><span class="l">${esc(s.slice(Math.max(0,k.start-46),k.start))}</span><span class="k" title="${esc(t("kw_full"))}">${esc(s.slice(k.start,k.end))}</span><span class="r">${esc(s.slice(k.end,k.end+46))}</span>${k.usage?` <span class="muted">${esc(exTitle("usage_"+k.usage))}${k.nl?` · <span class="nlt">${esc(exTitle("noun_like"))}</span>`:""}</span>`:""}</div>`; }).join("");
  wordlist();
}

const SAMPLE = {
  INT: "Layered transition-metal oxides have attracted considerable interest as cathode materials for sodium-ion batteries because sodium is abundant and the oxides can be prepared from inexpensive precursors.[1,2] Their practical use, however, remains limited. During charging, the layers glide relative to one another, and this phase transition produces large volume changes that crack the particles and shorten the cycle life.[3,4] Earlier studies reported that the transition begins at high states of charge and that it becomes more severe at elevated temperature.[5] Several strategies have been proposed to delay it. Kim et al. suggested that surface doping may suppress the transition, but the coating layers they examined were thin and the effect faded after a few hundred cycles.[6] Other groups have replaced part of the transition metal with inactive elements such as magnesium or zinc, which stabilizes the structure at the cost of capacity.[7,8] It is therefore not yet clear whether a small amount of a redox-inactive dopant can stabilize the layers without lowering the energy density. A second open question concerns the location of the dopant. Most reports assume that the dopant occupies the transition-metal layer, yet diffraction data alone rarely distinguish between this site and the sodium layer.[9] Because the two sites influence the gliding of the layers in different ways, the answer matters for the design of new materials. In this work, we introduce titanium into a layered sodium manganese oxide at a level of only two percent and examine how it changes the structure and the electrochemical behaviour. We combine diffraction, spectroscopy and long-term cycling to identify where titanium resides and how it affects the phase transition. We also compare the doped material with the pristine oxide under identical conditions so that the effect of the dopant can be separated from that of particle size and morphology. Our results indicate that bulk doping, rather than surface coating, is the more effective way to extend the cycle life of these cathodes, and they provide a simple guideline for selecting dopants in related layered oxides.",
  MET: "All oxides were synthesized by a conventional solid-state reaction. Stoichiometric amounts of sodium carbonate, manganese oxide, nickel oxide and titanium dioxide were weighed in air and mixed in an agate mortar for 30 min. A five percent excess of sodium carbonate was added to compensate for sodium loss at high temperature. The mixed powders were pressed into pellets under a pressure of 10 MPa, heated at 900 °C for 12 h in air and then cooled to room temperature at a rate of 5 °C per minute. The pellets were ground again, pressed and heated a second time under the same conditions to improve homogeneity. The final products were transferred to an argon-filled glove box immediately after cooling and stored there to avoid contact with moisture. The pristine sample was prepared in the same way without titanium dioxide. X-ray diffraction patterns were collected at room temperature on a laboratory diffractometer with Cu Kα radiation over a 2θ range of 10–80° with a step size of 0.02°. Structural parameters were refined by the Rietveld method, and the occupancy of each site was refined with the total composition fixed to the nominal value. The morphology of the particles was examined by scanning electron microscopy, and the elemental distribution was mapped by energy-dispersive spectroscopy. The chemical composition was determined by inductively coupled plasma analysis after the powders were dissolved in acid. For electrochemical tests, the cathode slurry was prepared by mixing the active material, carbon black and a binder in a weight ratio of 80:10:10 in N-methyl-2-pyrrolidone. The slurry was cast onto aluminium foil, dried at 120 °C under vacuum overnight and punched into discs with a diameter of 12 mm. The mass loading of active material was about 3 mg per square centimetre. Coin cells were assembled in the glove box using sodium metal as the counter electrode, a glass-fibre separator and a solution of sodium hexafluorophosphate in propylene carbonate as the electrolyte. Galvanostatic tests were performed between 2.0 and 4.3 V at 25 °C. Each measurement was repeated with at least three cells, and the average values are reported.",
  RD: "Figure 1 shows the diffraction patterns of the pristine and doped samples. All reflections can be indexed to a hexagonal cell, indicating that no impurity phase is formed within the detection limit of the instrument. Compared to the pristine oxide, the doped sample shows a slightly larger lattice parameter along the c axis, which suggests that titanium enters the structure rather than forming a separate oxide. The refinement supports this interpretation. When titanium was placed on the transition-metal site, the fit improved clearly, whereas placing it on the sodium site gave unrealistic thermal parameters. We therefore assign titanium to the transition-metal layer. The particles of both samples have a plate-like shape with a size of 2–5 μm, and the elemental maps show that titanium is distributed evenly across the particles. This observation rules out a surface-rich distribution of the dopant. Figure 2 compares the first charge and discharge curves. The two samples deliver similar initial capacities, so the small amount of titanium does not reduce the energy density in a measurable way. The voltage plateau associated with the phase transition, however, appears at a higher potential in the doped sample and is noticeably shorter. This result implies that titanium delays the gliding of the layers. A possible explanation is that the strong titanium–oxygen bonds make the layers more rigid, although other factors such as changes in sodium ordering may also contribute. Long-term cycling confirms the effect. After 300 cycles, the doped cathode retains about 85 percent of its initial capacity, while the pristine cathode retains less than 60 percent. Electron microscopy of the cycled electrodes reveals extensive cracking in the pristine particles but only minor cracks in the doped ones. It is likely that the reduced volume change prevents the formation of cracks and thereby slows the loss of electrical contact. We note that the improvement was smaller at 45 °C, which may indicate that side reactions with the electrolyte become more important at elevated temperature. Overall, these findings show that the dopant acts mainly in the bulk and that its benefit does not depend on a protective surface layer.",
  CON: "We have shown that a small amount of titanium, introduced into the transition-metal layer of a layered sodium manganese oxide, delays the phase transition that limits the cycle life of this cathode. The dopant was distributed evenly through the particles, and structural refinement placed it on the transition-metal site rather than in the sodium layer. Because the doped and pristine samples delivered almost the same initial capacity, the improvement in stability was obtained without a loss of energy density. The voltage plateau associated with layer gliding was shifted to a higher potential and shortened, and the cycled particles showed far fewer cracks. Taken together, these observations suggest that titanium stiffens the layers and reduces the volume change during charging, which in turn preserves the electrical contact within the electrode. These results suggest that bulk doping is a simple route to more durable cathodes. Unlike surface coatings, which can be lost after repeated cycling, a dopant built into the lattice remains active throughout the life of the cell. The approach also requires no additional processing step, since the dopant is added together with the other precursors before the solid-state reaction. Some limitations remain. The benefit was smaller at elevated temperature, which suggests that side reactions at the electrode surface were not addressed by doping alone. A combination of bulk doping with a stable electrolyte or a thin protective layer may therefore be needed for applications that operate above room temperature. In addition, we examined only one dopant level, and it is possible that slightly higher amounts would give a larger effect without lowering the capacity. Future work should test a range of compositions, examine other redox-inactive dopants with strong bonds to oxygen, and follow the structural changes during cycling by in situ diffraction. Such studies would clarify how general the mechanism proposed here is and would help researchers select dopants for other layered oxides used in sodium-ion and lithium-ion batteries."
